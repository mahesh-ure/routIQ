<template>
    <lightning-card title={label.title} icon-name="standard:work_order">

        <!-- ── Agent Not Found Error ─────────────────────────────────── -->
        <template lwc:if={agentError}>
            <div class="slds-p-around_medium">
                <lightning-illustration
                    size="small"
                    heading={label.emptyTitle}>
                    <p class="slds-text-body_regular">{label.emptyBody}</p>
                </lightning-illustration>
            </div>
        </template>

        <!-- ── Agent Panel ───────────────────────────────────────────── -->
        <template lwc:if={hasAgent}>

            <!-- ── Header: Status + Metrics ──────────────────────────── -->
            <div class="slds-p-horizontal_medium slds-p-top_small">
                <div class="slds-grid slds-gutters_x-small slds-grid_vertical-align-center">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label={label.statusLabel}
                            value={agentStatus}
                            options={statusOptions}
                            variant="label-hidden"
                            onchange={handleStatusChange}>
                        </lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-text-align_right">
                        <span class={statusBadgeClass}>{agentStatus}</span>
                    </div>
                </div>

                <div class="slds-grid slds-gutters_x-small slds-m-top_small">
                    <div class="slds-col slds-size_1-of-2">
                        <div class="metric-card">
                            <span class="metric-label">{label.currentLoad}</span>
                            <span class="metric-value">{loadDisplay}</span>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2">
                        <div class="metric-card">
                            <span class="metric-label">{label.queueDepth}</span>
                            <span class="metric-value">{queueDisplay}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="slds-p-around_medium">

                <!-- ── Active Work List ──────────────────────────────── -->
                <template lwc:if={hasWork}>

                    <div class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                        <span class="slds-text-title_caps">{label.assignedHeader}</span>
                        <span class="slds-text-body_small slds-text-color_weak">{itemCountLabel}</span>
                    </div>

                    <template for:each={workItems} for:item="item">
                        <div key={item.recordId} class="work-card slds-box slds-theme_shade slds-m-bottom_x-small">

                            <!-- Record Link -->
                            <div class="slds-grid slds-grid_vertical-align-center">
                                <lightning-icon
                                    icon-name="utility:record"
                                    size="x-small"
                                    class="slds-m-right_x-small">
                                </lightning-icon>
                                <div class="slds-grow">
                                    <p class="slds-text-body_small slds-text-color_weak">{label.assigned}</p>
                                    <a href={item.recordUrl}
                                       data-record-id={item.recordId}
                                       onclick={handleNavigate}>
                                        <strong>{item.recordName}</strong>
                                    </a>
                                </div>
                                <div class="slds-shrink-none">
                                    <lightning-button
                                        label={label.defer}
                                        variant="neutral"
                                        icon-name="utility:undo"
                                        data-record-id={item.recordId}
                                        data-config-dev-name={item.configDevName}
                                        onclick={handleDefer}>
                                    </lightning-button>
                                </div>
                            </div>

                            <!-- Per-item SLA Countdown -->
                            <template lwc:if={item.hasSla}>
                                <div class="sla-section slds-m-top_x-small">
                                    <p class="slds-text-body_small slds-text-color_weak">
                                        {label.slaRemaining}
                                    </p>
                                    <div class={item.slaColorClass}>
                                        <template lwc:if={item.slaExpired}>
                                            <span class="sla-timer">{label.slaExpired}</span>
                                        </template>
                                        <template lwc:else>
                                            <span class="sla-timer">{item.slaDisplay}</span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>

                <!-- ── Routing Spinner ───────────────────────────────── -->
                <template lwc:elseif={isRouting}>
                    <div class="slds-align_absolute-center slds-m-vertical_medium">
                        <lightning-spinner
                            alternative-text={label.loadingWork}
                            size="small">
                        </lightning-spinner>
                    </div>
                </template>

                <!-- ── Empty State ───────────────────────────────────── -->
                <template lwc:else>
                    <div class="empty-state slds-text-align_center slds-m-vertical_medium">
                        <lightning-icon
                            icon-name="utility:inbox"
                            size="large"
                            class="slds-m-bottom_small empty-icon">
                        </lightning-icon>
                        <p class="slds-text-heading_small">{label.emptyTitle}</p>
                        <p class="slds-text-body_regular slds-text-color_weak slds-m-top_xx-small">
                            {label.emptyBody}
                        </p>
                    </div>
                </template>

                <!-- ── Next Best Action ─────────────────────────────── -->
                <div class="slds-m-top_small">
                    <lightning-button
                        label={nextButtonLabel}
                        variant="brand"
                        icon-name="utility:forward"
                        onclick={handleGetNextWork}
                        disabled={isNextDisabled}
                        class="full-width">
                    </lightning-button>
                </div>
            </div>
        </template>

    </lightning-card>
</template>
